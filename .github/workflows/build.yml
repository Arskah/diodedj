name: Build

on:
  workflow_call:
    inputs:
      platform:
        description: GitHub-hosted runner image (e.g. ubuntu-24.04, macos-14, windows-latest)
        type: string
        required: true
      target:
        description: Rust target triple
        type: string
        required: true
      args:
        description: Extra args to `pnpm tauri build` (e.g. --target <triple>)
        type: string
        default: ""
      artifact-name:
        description: Name of the uploaded artifact bundle
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux deps
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: pnpm tauri build ${{ inputs.args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            src-tauri/target/${{ inputs.target }}/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
