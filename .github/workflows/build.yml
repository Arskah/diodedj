name: Build

on:
  workflow_call:
    inputs:
      platform:
        description: GitHub-hosted runner image (e.g. ubuntu-24.04, macos-14, windows-latest)
        type: string
        required: true
      target:
        description: Rust target triple
        type: string
        required: true
      args:
        description: Extra args passed to `tauri build` (e.g. `--target <triple>`, `--no-bundle`)
        type: string
        default: ""
      artifact-name:
        description: Name of the uploaded artifact bundle
        type: string
        required: true
      sign-windows:
        description: Sign Windows bundles via signing.windows.conf.json overlay (needs signing secrets). See docs/signing.md
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.platform }}
    env:
      # Signing secrets — empty until configured; see docs/signing.md.
      # Available to this reusable workflow because callers pass `secrets: inherit`.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a75363d06101555fc97c6c7e1e65670b99104d98 # 1.96.1
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux deps
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Linux AppImage GPG signing. No-op unless GPG_PRIVATE_KEY secret is set.
      - name: Import GPG signing key (Linux AppImage)
        if: startsWith(inputs.platform, 'ubuntu') && env.GPG_PRIVATE_KEY != ''
        shell: bash
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          {
            echo "SIGN=1"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
          } >> "$GITHUB_ENV"
          [ -n "$GPG_KEY_ID" ] && echo "SIGN_KEY=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        with:
          # `--config signing.windows.conf.json` overlays the Authenticode signCommand
          # only when sign-windows is enabled. See docs/signing.md.
          args: ${{ inputs.sign-windows && format('{0} --config src-tauri/signing.windows.conf.json', inputs.args) || inputs.args }}
          tauriScript: pnpm tauri

      - name: Stage bundles
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p staging
          if [ -n "$ARTIFACT_PATHS" ]; then
            echo "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while read -r p; do
              [ -n "$p" ] && cp -r "$p" staging/
            done
          fi
          # Also stage the raw binary so downstream jobs (e.g. e2e) can run
          # the app without rebuilding. Skipped silently if not present.
          for binary in \
            src-tauri/target/release/radiodiodj \
            src-tauri/target/release/radiodiodj.exe; do
            [ -f "$binary" ] && cp "$binary" staging/
          done
          ls -la staging/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: staging/**
          if-no-files-found: error
          retention-days: 7
