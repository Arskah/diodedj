name: Build

on:
  workflow_call:
    inputs:
      platform:
        description: GitHub-hosted runner image (e.g. ubuntu-24.04, macos-14, windows-latest)
        type: string
        required: true
      target:
        description: Rust target triple
        type: string
        required: true
      args:
        description: Extra args passed to `tauri build` (e.g. `--target <triple>`, `--no-bundle`)
        type: string
        default: ""
      artifact-name:
        description: Name of the uploaded artifact bundle
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux deps
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        with:
          args: ${{ inputs.args }}
          tauriScript: pnpm tauri

      - name: Stage bundles
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p staging
          if [ -n "$ARTIFACT_PATHS" ]; then
            echo "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while read -r p; do
              [ -n "$p" ] && cp -r "$p" staging/
            done
          fi
          # Also stage the raw binary so downstream jobs (e.g. e2e) can run
          # the app without rebuilding. Skipped silently if not present.
          for binary in \
            src-tauri/target/release/diodedj \
            src-tauri/target/release/diodedj.exe; do
            [ -f "$binary" ] && cp "$binary" staging/
          done
          ls -la staging/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: staging/**
          if-no-files-found: error
          retention-days: 7
