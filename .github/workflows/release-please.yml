name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      release_tag: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Generate custom token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        id: token
        with:
          app_id: ${{ secrets.CUSTOM_TOKEN_APP_ID }}
          private_key: ${{ secrets.CUSTOM_TOKEN_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-please
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos-arm64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-14
      target: aarch64-apple-darwin
      args: --target aarch64-apple-darwin
      artifact-name: bundle-macos-arm64

  build-macos-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-14
      target: x86_64-apple-darwin
      args: --target x86_64-apple-darwin
      artifact-name: bundle-macos-x64

  build-linux-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      args: ""
      artifact-name: bundle-linux-x64

  build-windows-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      args: ""
      artifact-name: bundle-windows-x64

  upload-release:
    needs:
      - release-please
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-windows-x64
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Upload bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(artifacts/**/*.dmg artifacts/**/*.app.tar.gz artifacts/**/*.AppImage artifacts/**/*.deb artifacts/**/*.rpm artifacts/**/*.msi artifacts/**/*.exe artifacts/**/*.nsis.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundle artifacts found" >&2
            find artifacts -type f >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
