<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiodeDJ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div id="search-area">
          <input
            type="text"
            id="search-input"
            placeholder="Search tracks..."
            autocomplete="off"
          />
        </div>
        <div id="toolbar-actions">
          <button id="btn-paths" title="Manage library paths">Paths</button>
          <button id="btn-scan" title="Rescan all library paths">Scan</button>
          <button id="btn-generate" title="Generate random playlist">
            Auto Playlist
          </button>
          <span id="library-stats"></span>
        </div>
      </header>

      <main id="content">
        <section id="library-panel">
          <div id="library-tabs">
            <button class="lib-tab active" data-type="music">Music</button>
            <button class="lib-tab" data-type="commercial">Commercials</button>
            <button class="lib-tab" data-type="jingle">Jingles</button>
          </div>
          <div id="track-list"></div>
        </section>

        <section id="playlist-panel">
          <div id="playlist-header">
            <h2>Playlist <span id="playlist-count"></span></h2>
            <button id="btn-clear-playlist" title="Clear playlist">
              Clear
            </button>
          </div>
          <div id="playlist"></div>
        </section>
      </main>

      <footer id="now-playing">
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <div id="player-info">
          <div id="track-info">
            <span id="np-title">No track loaded</span>
            <span id="np-artist"></span>
          </div>
          <div id="player-controls">
            <button id="btn-prev" title="Previous">&#9198;</button>
            <button id="btn-play" title="Play">&#9654;</button>
            <button id="btn-stop" title="Stop">&#9632;</button>
            <button id="btn-next" title="Next">&#9197;</button>
          </div>
          <button
            id="btn-mode"
            class="active"
            title="Auto/Manual playback mode"
          >
            AUTO
          </button>
          <div id="player-right">
            <span id="time-display">0:00 / 0:00</span>
            <input
              type="range"
              id="volume"
              min="0"
              max="1"
              step="0.01"
              value="1"
              title="Volume"
            />
          </div>
        </div>
      </footer>

      <div id="paths-overlay" class="hidden">
        <div id="paths-modal">
          <h3>Library Paths</h3>
          <div id="paths-list"></div>
          <div id="paths-actions">
            <button id="btn-close-paths">Close</button>
          </div>
        </div>
      </div>

      <div id="scan-overlay" class="hidden">
        <div id="scan-modal">
          <h3>Scanning Library...</h3>
          <div id="scan-status">Preparing...</div>
          <div id="scan-bar-container">
            <div id="scan-bar-fill"></div>
          </div>
        </div>
      </div>

      <audio id="audio"></audio>
    </div>
    <script>
      var exports = {};
    </script>
    <script src="renderer.js"></script>
  </body>
</html>
