<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Vinyl record: body + concentric grooves + rim/sheen, no center label.
     Shared source of truth for the rotating player disc (CSS background) and
     the app icon (composited with radiodiodi_label.svg in radiodiodi_vinyl.svg).
     The center is left as bare body; a label/cover art always sits on top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="vinyl" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="sheen" cx="42%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- vinyl body -->
  <circle cx="512" cy="512" r="500" fill="url(#vinyl)"/>

  <!-- grooves -->
  <g fill="none" stroke="#000000" stroke-opacity="0.75" stroke-width="3">
    <circle cx="512" cy="512" r="470"/>
    <circle cx="512" cy="512" r="450"/>
    <circle cx="512" cy="512" r="430"/>
    <circle cx="512" cy="512" r="410"/>
    <circle cx="512" cy="512" r="390"/>
    <circle cx="512" cy="512" r="370"/>
    <circle cx="512" cy="512" r="350"/>
    <circle cx="512" cy="512" r="330"/>
    <circle cx="512" cy="512" r="310"/>
    <circle cx="512" cy="512" r="290"/>
  </g>
  <g fill="none" stroke="#9a9a9a" stroke-opacity="1" stroke-width="5">
    <circle cx="512" cy="512" r="462"/>
    <circle cx="512" cy="512" r="434"/>
    <circle cx="512" cy="512" r="406"/>
    <circle cx="512" cy="512" r="378"/>
    <circle cx="512" cy="512" r="350"/>
    <circle cx="512" cy="512" r="322"/>
    <circle cx="512" cy="512" r="294"/>
  </g>

  <!-- light sheen -->
  <circle cx="512" cy="512" r="500" fill="url(#sheen)"/>

  <!-- outer rim -->
  <circle cx="512" cy="512" r="499" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="3"/>
</svg>
