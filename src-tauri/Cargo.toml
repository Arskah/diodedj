[package]
name = "diodedj"
version = "0.10.0"
description = "Radio station music player"
authors = ["Aarni Halinen"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diodedj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-log = "=2.8.0"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
parking_lot = "=0.12.5"
anyhow = "=1.0.102"
walkdir = "=2.5.0"
lofty = "=0.24.0"
tokio = { version = "=1.52.3", features = ["rt", "sync", "time"] }
log = "=0.4.29"
rodio = { version = "=0.21.1", features = ["symphonia-aac", "symphonia-isomp4"] }
cpal = "=0.16.0"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
chrono = { version = "=0.4.44", features = ["serde"] }

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
