[package]
name = "diodedj"
version = "0.7.1" # x-release-please-version
description = "Radio station music player"
authors = ["Aarni Halinen"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diodedj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-dialog = "=2.7.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
parking_lot = "=0.12.5"
anyhow = "=1.0.102"
walkdir = "=2.5.0"
lofty = "=0.24.0"
tokio = { version = "=1.52.2", features = ["rt", "sync", "time"] }
log = "=0.4.29"
rodio = { version = "=0.21.1", features = ["symphonia-aac", "symphonia-isomp4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
